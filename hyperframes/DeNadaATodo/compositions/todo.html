  <script>
    const R = window.R2HF;
    const tl = gsap.timeline({ paused: true });
    // Partículas: y = 1080 + 50 − ((fotograma · velocidad + desfase) mod 1180)
    const particulas = Array.from(document.querySelectorAll(".todo-particula")).map((el) => ({
      el,
      v: Number(el.dataset.velocidad),
      y0: Number(el.dataset.desfase),
    }));
    const reloj = { f: 0 };
    const colocar = () => {
      for (const p of particulas) {
        p.el.style.top = 1080 + 50 - ((reloj.f * p.v + p.y0) % (1080 + 100)) + "px";
      }
    };
    colocar();
    tl.fromTo(reloj, { f: 0 }, { f: 165, duration: 5.5, ease: "none", onUpdate: colocar }, 0);
    // Texto: opacidad 6→36; escala 0→165 (0.9→1.05, perceptual)
    tl.fromTo("#todo-texto", { opacity: 0 }, { opacity: 1, duration: 1, ease: "none" }, 0.2);
    tl.fromTo("#todo-texto", { scale: 0.9 }, { scale: 1.05, duration: 5.5, ease: R.perceptual(0.9, 1.05) }, 0);
    window.__timelines["todo"] = tl;
